<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Meus Dados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="dados/dados.css">
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <a href="Perfil.html" class="btn-back"><i class="bi bi-chevron-left"></i></a>
      <div class="header-title">Meus Dados</div>
    </header>

    <div class="form-section-title">Informações Pessoais</div>
    
    <div class="custom-input-box">
      <i class="bi bi-person"></i>
      <input type="text" value="Flavio Henrique" placeholder="Nome Completo">
    </div>
    <div class="custom-input-box">
      <i class="bi bi-envelope"></i>
      <input type="email" value="flavio@gmail.com" placeholder="E-mail">
    </div>
    <div class="custom-input-box">
      <i class="bi bi-telephone"></i>
      <input type="tel" value="(11) 88267-2516" placeholder="Telefone">
    </div>

    <div class="form-section-title mt-3">Endereço de Entrega</div>
    
    <div class="custom-input-box">
      <i class="bi bi-geo-alt"></i>
      <input type="text" value="Rua Mente Leve, 123" placeholder="Endereço Completo">
    </div>
    <div class="custom-input-box">
      <i class="bi bi-map"></i>
      <input type="text" value="São Paulo - SP" placeholder="Cidade / Estado">
    </div>

    <button class="btn-save mt-4">Salvar Alterações</button>
  </div>
</body>
</html>
